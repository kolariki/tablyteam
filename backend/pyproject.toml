[project]
name = "agent-arena-backend"
version = "0.1.0"
description = "Multi-LLM agent arena: orchestrator + realtime event stream + Langfuse tracing"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.50",
    "anthropic>=0.40",
    "langfuse>=4.0",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "cryptography>=50.0.2",
    "python-multipart>=0.0.32",
    "pypdf>=6.20.1",
    "markdown>=3.11.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
